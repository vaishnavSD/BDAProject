# =============================================================================
# Smart Inventory Management System — Full Stack Docker Compose
# Services: Zookeeper, Kafka, Kafka-UI, PostgreSQL, Spark, Airflow, FastAPI
#
# Usage:
#   First run  : docker-compose up -d --build
#   Normal run : docker-compose up -d
#   Teardown   : docker-compose down -v
#   Logs       : docker-compose logs -f <service>
#
# Network: all services share the internal bridge network "inventory_net"
# Volumes: named volumes for data persistence across container restarts
# =============================================================================

version: "3.9"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow_db
    AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nFe7h8="
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 30
    # Spark connection for SparkSubmitOperator
    AIRFLOW_CONN_SPARK_DEFAULT: "spark://spark-master:7077"
    # Inventory DB connection for PostgresOperator / hooks
    AIRFLOW_CONN_INVENTORY_DB: "postgresql://inventory:inventory@postgres:5432/smart_inventory"
  volumes:
    - ../orchestration/dags:/opt/airflow/dags
    - ../orchestration/plugins:/opt/airflow/plugins
    - ../batch:/opt/airflow/batch
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - inventory_net

services:

  # ─────────────────────────────────────────────────────────────
  # ZOOKEEPER — Kafka cluster coordinator
  # ─────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: inventory_zookeeper
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "bash", "-c", "echo srvr | nc localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventory_net

  # ─────────────────────────────────────────────────────────────
  # KAFKA BROKER — central event streaming backbone
  # ─────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: inventory_kafka
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"       # accessible from host (for producers run outside Docker)
      - "9101:9101"       # JMX metrics
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      # PLAINTEXT_HOST: for external clients (host machine)
      # PLAINTEXT:      for internal Docker network clients
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics created explicitly by init service
      KAFKA_LOG_RETENTION_HOURS: 168             # 7-day retention
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - inventory_net

  # ─────────────────────────────────────────────────────────────
  # KAFKA INIT — creates all required topics on first boot
  # ─────────────────────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: inventory_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Waiting for Kafka to be fully ready...'
      sleep 5
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic inventory-live-orders     --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic inventory-live-shipments  --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic inventory-live-dispatches --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic inventory-alerts          --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic inventory-dlq             --partitions 1 --replication-factor 1
      echo 'Topics created:'
      kafka-topics --bootstrap-server kafka:29092 --list
      "
    networks:
      - inventory_net

  # ─────────────────────────────────────────────────────────────
  # KAFKA UI — browser-based Kafka cluster management
  # Access: http://localhost:8080
  # ─────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: inventory_kafka_ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "18080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: inventory-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - inventory_net

  # ─────────────────────────────────────────────────────────────
  # POSTGRESQL — single source of truth for all structured data
  # Access: localhost:5432
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: inventory_postgres
    hostname: postgres
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: smart_inventory,airflow_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d   # init scripts
      - ../database/migrations:/migrations             # SQL migrations (mounted read-only)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - inventory_net

  # ─────────────────────────────────────────────────────────────
  # SPARK MASTER — cluster manager
  # Web UI: http://localhost:8081
  # ─────────────────────────────────────────────────────────────
  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: inventory_spark_master
    hostname: spark-master
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8081
    ports:
      - "18081:8081"   # Spark Master Web UI
      - "7077:7077"   # Spark Master submit port
    volumes:
      - ../batch:/opt/spark-apps/batch
      - ../streaming:/opt/spark-apps/streaming
      - ../data:/opt/spark-data
      - spark_checkpoints:/opt/spark-checkpoints
    networks:
      - inventory_net

  # ─────────────────────────────────────────────────────────────
  # SPARK WORKER — execution node
  # Web UI: http://localhost:8082
  # ─────────────────────────────────────────────────────────────
  spark-worker:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: inventory_spark_worker
    hostname: spark-worker
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_WEBUI_PORT: 8082
    ports:
      - "18082:8082"   # Spark Worker Web UI
    volumes:
      - ../batch:/opt/spark-apps/batch
      - ../streaming:/opt/spark-apps/streaming
      - ../data:/opt/spark-data
      - spark_checkpoints:/opt/spark-checkpoints
    networks:
      - inventory_net

  # ─────────────────────────────────────────────────────────────
  # AIRFLOW WEBSERVER — DAG management UI
  # Access: http://localhost:8085  (admin / admin)
  # ─────────────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: inventory_airflow_webserver
    command: webserver
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # AIRFLOW SCHEDULER — executes DAGs on schedule
  # ─────────────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: inventory_airflow_scheduler
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # FASTAPI — REST + WebSocket API server
  # Access: http://localhost:8000
  # Docs:   http://localhost:8000/docs
  # ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: inventory_api
    hostname: api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: smart_inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    volumes:
      - ../api:/app/api
    networks:
      - inventory_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # REACT DASHBOARD — served via nginx
  # Access: http://localhost:3000
  # ─────────────────────────────────────────────────────────────
  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: inventory_dashboard
    depends_on:
      - api
    ports:
      - "3000:80"
    networks:
      - inventory_net

  # ─────────────────────────────────────────────────────────────
  # AIRFLOW INIT — creates DB tables and admin user (runs once)
  # ─────────────────────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: inventory_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@smartinventory.local
        echo "Airflow initialised."
    restart: on-failure

# ─────────────────────────────────────────────────────────────
# NAMED VOLUMES
# ─────────────────────────────────────────────────────────────
volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  postgres_data:
  airflow_logs:
  spark_checkpoints:

# ─────────────────────────────────────────────────────────────
# NETWORK
# ─────────────────────────────────────────────────────────────
networks:
  inventory_net:
    driver: bridge
    name: inventory_net
